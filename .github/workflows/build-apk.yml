name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk GymTrack-v1.0.apk
      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Latest APK"
          body: "Debug build of GymTrack v1.0. Install directly - Android will show unknown developer warning."
          files: GymTrack-v1.0.apk